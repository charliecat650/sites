<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>showdown</title><style>*{box-sizing:border-box}
html,body{margin:0;background:#0d1014;color:#e6e8eb;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent2)}
.gc-page{margin:0 auto;padding:32px 24px 64px}
.gc-head h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.gc-summary{color:#a7afb9;margin:0 0 24px;max-width:860px}
.gc-body,.gc-stack{display:flex;flex-direction:column;gap:16px}
.gc-section.gc-d0{margin-top:20px}
.gc-h{margin:0;font-weight:700;display:flex;gap:6px;align-items:center}
h2.gc-h{font-size:21px;padding-bottom:6px;border-bottom:1px solid #ffffff14}
h3.gc-h{font-size:17px}
h4.gc-h{font-size:15px;color:#cfd5dc}
.gc-d1,.gc-d2{background:#151a21;border:1px solid #ffffff12;border-radius:12px;padding:16px}
.gc-grid.plain>.gc-section,.gc-d2 .gc-d2{background:transparent;border:0;padding:0}
.gc-caption{color:#8f98a3;font-size:13px;margin:2px 0 6px}
.gc-section>.gc-caption+.gc-stack,.gc-section>.gc-h+.gc-stack{margin-top:10px}
.gc-caret{color:#8f98a3;width:14px}
.gc-text{margin:0;color:#d4d9df}
.gc-grid{display:grid;gap:14px;align-items:start}
.gc-grid.plain{gap:8px}
.gc-tablewrap{overflow-x:auto;border:1px solid #ffffff14;border-radius:10px}
.gc-table{border-collapse:collapse;width:100%;font-size:14px}
.gc-table th{background:#1a2029;color:#a7afb9;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;white-space:nowrap;position:sticky;top:0}
.gc-table td{padding:8px 12px;border-top:1px solid #ffffff0f;vertical-align:top}
.gc-table tr:hover td{background:#ffffff06}
.gc-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gc-metric{background:#151a21;border:1px solid #ffffff12;border-top:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.gc-mval{font-size:24px;font-weight:800;line-height:1.2}
.gc-mlab{color:#a7afb9;font-size:13px}
.gc-mdet{color:#7d8691;font-size:12px}
.gc-rows{display:flex;flex-direction:column;border:1px solid #ffffff12;border-radius:10px;overflow:hidden}
.gc-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border-top:1px solid #ffffff0f;background:#12161c}
.gc-row:first-child{border-top:0}
.gc-rowtitle{font-weight:600}
.gc-rowdet{color:#aab2bc;font-size:14px;margin-top:2px}
.gc-meta{color:#7d8691;font-weight:400;font-size:13px}
.gc-pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.gc-callout{background:#151a21;border:1px solid #ffffff12;border-left:4px solid;border-radius:8px;padding:12px 16px;color:#d4d9df}
.gc-status{display:flex;gap:8px;align-items:center;color:#aab2bc;font-size:14px}
.gc-dot{width:8px;height:8px;border-radius:9px;display:inline-block}
.gc-proscons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gc-pc{border-radius:10px;padding:12px 14px;border:1px solid}
.gc-pc.pros{background:#3fcf6e10;border-color:#3fcf6e40}
.gc-pc.cons{background:#f06a6a10;border-color:#f06a6a40}
.gc-pch{font-weight:700;margin-bottom:4px}
.gc-pc.pros .gc-pch{color:#5fdc88}.gc-pc.cons .gc-pch{color:#f38b8b}
.gc-pc ul,.gc-bullets{margin:0;padding-left:20px}
.gc-pc li{margin:3px 0;font-size:14px}
.gc-props{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:0;font-size:14px}
.gc-props dt{color:#8f98a3}.gc-props dd{margin:0}
.gc-seg{display:inline-flex;align-self:flex-start;flex-wrap:wrap;background:#151a21;border:1px solid #ffffff14;border-radius:10px;padding:3px;gap:2px}
.gc-seg button{background:transparent;border:0;color:#a7afb9;font:inherit;font-size:14px;padding:6px 14px;border-radius:7px;cursor:pointer}
.gc-seg button.on{background:var(--accent);color:#0b0d10;font-weight:700}
.gc-count{margin-left:6px;font-size:11px;opacity:.75}
.gc-field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.gc-flabel{color:#8f98a3}
.gc-field select,.gc-field input{background:#0f1318;color:#e6e8eb;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.gc-tg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:7px 0;font-size:14px}
.gc-sw{width:34px;height:20px;border-radius:20px;background:#2a313b;position:relative;display:inline-block}
.gc-sw span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:16px;background:#cfd5dc;transition:.15s}
.gc-sw.on{background:var(--accent)}.gc-sw.on span{left:16px;background:#fff}
.gc-btn{font:inherit;font-size:14px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid #ffffff22;background:#1a2029;color:#e6e8eb;text-align:left;align-self:flex-start}
.gc-btn.primary{background:var(--accent);color:#0b0d10;border-color:transparent;font-weight:700}
.gc-btn.quiet{background:transparent;border:0;padding:0;color:var(--accent);font-weight:600}
.gc-btn.quiet:hover{text-decoration:underline}
.gc-grid>.gc-btn{justify-self:start}.gc-grid>.gc-btn:not(.quiet){align-self:end}
.gc-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gc-link{display:block;background:#151a21;border:1px solid #ffffff14;border-radius:10px;padding:12px 14px;text-decoration:none;color:#e6e8eb}
.gc-linkt{font-weight:600}.gc-links2{color:#8f98a3;font-size:13px}
.gc-chart{background:#151a21;border:1px solid #ffffff12;border-radius:10px;padding:12px}
.gc-legend{display:flex;gap:16px;font-size:13px;color:#c9d1d9;margin-bottom:6px}
.gc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.gc-sources{margin-top:40px;padding-top:12px;border-top:1px solid #ffffff14;color:#8f98a3;font-size:13px}
.gc-sources ol{margin:4px 0 0;padding-left:20px}
.gc-label{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
