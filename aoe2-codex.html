<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aoe2-codex</title><style>*{box-sizing:border-box}
html,body{margin:0;background:#0d1014;color:#e6e8eb;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent2)}
.gc-page{margin:0 auto;padding:32px 24px 64px}
.gc-head h1{font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.gc-summary{color:#a7afb9;margin:0 0 24px;max-width:860px}
.gc-body,.gc-stack{display:flex;flex-direction:column;gap:16px}
.gc-section.gc-d0{margin-top:20px}
.gc-h{margin:0;font-weight:700;display:flex;gap:6px;align-items:center}
h2.gc-h{font-size:21px;padding-bottom:6px;border-bottom:1px solid #ffffff14}
h3.gc-h{font-size:17px}
h4.gc-h{font-size:15px;color:#cfd5dc}
.gc-d1,.gc-d2{background:#151a21;border:1px solid #ffffff12;border-radius:12px;padding:16px}
.gc-grid.plain>.gc-section,.gc-d2 .gc-d2{background:transparent;border:0;padding:0}
.gc-caption{color:#8f98a3;font-size:13px;margin:2px 0 6px}
.gc-section>.gc-caption+.gc-stack,.gc-section>.gc-h+.gc-stack{margin-top:10px}
.gc-caret{color:#8f98a3;width:14px}
.gc-text{margin:0;color:#d4d9df}
.gc-grid{display:grid;gap:14px;align-items:start}
.gc-grid.plain{gap:8px}
.gc-tablewrap{overflow-x:auto;border:1px solid #ffffff14;border-radius:10px}
.gc-table{border-collapse:collapse;width:100%;font-size:14px}
.gc-table th{background:#1a2029;color:#a7afb9;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;white-space:nowrap;position:sticky;top:0}
.gc-table td{padding:8px 12px;border-top:1px solid #ffffff0f;vertical-align:top}
.gc-table tr:hover td{background:#ffffff06}
.gc-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gc-metric{background:#151a21;border:1px solid #ffffff12;border-top:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.gc-mval{font-size:24px;font-weight:800;line-height:1.2}
.gc-mlab{color:#a7afb9;font-size:13px}
.gc-mdet{color:#7d8691;font-size:12px}
.gc-rows{display:flex;flex-direction:column;border:1px solid #ffffff12;border-radius:10px;overflow:hidden}
.gc-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border-top:1px solid #ffffff0f;background:#12161c}
.gc-row:first-child{border-top:0}
.gc-rowtitle{font-weight:600}
.gc-rowdet{color:#aab2bc;font-size:14px;margin-top:2px}
.gc-meta{color:#7d8691;font-weight:400;font-size:13px}
.gc-pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.gc-callout{background:#151a21;border:1px solid #ffffff12;border-left:4px solid;border-radius:8px;padding:12px 16px;color:#d4d9df}
.gc-status{display:flex;gap:8px;align-items:center;color:#aab2bc;font-size:14px}
.gc-dot{width:8px;height:8px;border-radius:9px;display:inline-block}
.gc-proscons{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gc-pc{border-radius:10px;padding:12px 14px;border:1px solid}
.gc-pc.pros{background:#3fcf6e10;border-color:#3fcf6e40}
.gc-pc.cons{background:#f06a6a10;border-color:#f06a6a40}
.gc-pch{font-weight:700;margin-bottom:4px}
.gc-pc.pros .gc-pch{color:#5fdc88}.gc-pc.cons .gc-pch{color:#f38b8b}
.gc-pc ul,.gc-bullets{margin:0;padding-left:20px}
.gc-pc li{margin:3px 0;font-size:14px}
.gc-props{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:0;font-size:14px}
.gc-props dt{color:#8f98a3}.gc-props dd{margin:0}
.gc-seg{display:inline-flex;align-self:flex-start;flex-wrap:wrap;background:#151a21;border:1px solid #ffffff14;border-radius:10px;padding:3px;gap:2px}
.gc-seg button{background:transparent;border:0;color:#a7afb9;font:inherit;font-size:14px;padding:6px 14px;border-radius:7px;cursor:pointer}
.gc-seg button.on{background:var(--accent);color:#0b0d10;font-weight:700}
.gc-count{margin-left:6px;font-size:11px;opacity:.75}
.gc-field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.gc-flabel{color:#8f98a3}
.gc-field select,.gc-field input{background:#0f1318;color:#e6e8eb;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.gc-tg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:7px 0;font-size:14px}
.gc-sw{width:34px;height:20px;border-radius:20px;background:#2a313b;position:relative;display:inline-block}
.gc-sw span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:16px;background:#cfd5dc;transition:.15s}
.gc-sw.on{background:var(--accent)}.gc-sw.on span{left:16px;background:#fff}
.gc-btn{font:inherit;font-size:14px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid #ffffff22;background:#1a2029;color:#e6e8eb;text-align:left;align-self:flex-start}
.gc-btn.primary{background:var(--accent);color:#0b0d10;border-color:transparent;font-weight:700}
.gc-btn.quiet{background:transparent;border:0;padding:0;color:var(--accent);font-weight:600}
.gc-btn.quiet:hover{text-decoration:underline}
.gc-grid>.gc-btn{justify-self:start}.gc-grid>.gc-btn:not(.quiet){align-self:end}
.gc-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gc-link{display:block;background:#151a21;border:1px solid #ffffff14;border-radius:10px;padding:12px 14px;text-decoration:none;color:#e6e8eb}
.gc-linkt{font-weight:600}.gc-links2{color:#8f98a3;font-size:13px}
.gc-chart{background:#151a21;border:1px solid #ffffff12;border-radius:10px;padding:12px}
.gc-legend{display:flex;gap:16px;font-size:13px;color:#c9d1d9;margin-bottom:6px}
.gc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.gc-sources{margin-top:40px;padding-top:12px;border-top:1px solid #ffffff14;color:#8f98a3;font-size:13px}
.gc-sources ol{margin:4px 0 0;padding-left:20px}
.gc-label{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}

rong vs. Infantry. Weak vs. Skirmishers and Camel Riders."],["The Archer line is the standard ranged unit of the game and the core of 'archer civilizations'. Massed Crossbowmen and Arbalesters deal steady damage from range and kite slow melee units. They are fragile and very vulnerable to Skirmishers, Mangonels and fast cavalry that reach them.",["Skirmishers","Mangonel-line","Knights/Light Cavalry","Eagle Warriors","Huskarls"],[[5,"Foot Archers +1/+2 range in Castle/Imperial Age; Yeomen (Foot Archers and Skirmisher-li\u2026"],[43,"Archery Unit technologies at the Archery Range and Blacksmith cost -25%; Bolt Magazine\u2026"],[36,"Champi Warriors and Archery Range Units +1/2/3 melee armor in Feudal/Castle/Imperial Ag\u2026"],[49,"Archery Range and Barracks upgrades cost -50% food; Curare (Foot Archers and Fortificat\u2026"],[15,"Foot Archers attack +18% faster"],[23,"Foot Archers and Condottieri +1 melee/+1 pierce armor"],[34,"Foot Archers cost -10/20/30% in Feudal/Castle/Imperial Age"]],["Long range, strong in mass","Good vs Infantry and Spearmen","Retains value into late game with Thumb Ring/Bracer"],["Low HP and no melee armor","Countered hard by Skirmishers and Mangonel-line","Gold intensive"],"All-purpose Foot Archer. Strong vs. units at long range. Weak vs. Skirmishers, Mangonel-line and units at close range."],["Cavalry Archers are fast ranged units built for hit-and-run. Fully upgraded they are very strong, and they are the signature unit of steppe civilizations. They are expensive to tech into, and Skirmishers or Camel Archers beat them.",["Skirmishers","Camel Archers","Light Cavalry/Hussars in mass","Scorpions"],[[47,"Silk Armor (Scout Cavalry-line, Steppe Lancers and Cavalry Archers +1 melee/+1 pierce a\u2026"],[30,"Recurve Bow (Mounted Archers +1 attack, +1 range); Team: Mounted Archers train +25% faster"],[35,"Cavalry Archers attack +25% faster"],[12,"Steppe Husbandry (Scout Cavalry-line, Steppe Lancers and Cavalry Archers train +100% fa\u2026"],[21,"Cav t Fire Ship, Cannon Galleon, Architecture, Siege Engineers, Arrowslits, Shipwright, Stone Shaft Mining, Two-Man Saw, Crop Rotation","Armenians get Spearman- and Militia-line upgrades (except Man-at-Arms) one age earlier and Fereters adds +30 HP to non-spearman infantry, so early Long Swordsman/Pikeman aggression into Champions and Halberdiers is the core plan. Composite Bowmen and fully upgraded Arbalesters back the infantry, while Warrior Priests both fight and heal; the first Fortified Church comes with a free Relic. Cheaper, stronger Mule Carts support the economy, and on water their Galley-line and Dromons fire an extra projectile (+1 range with Cilician Fleet). Their weak points are the Stable (no Hussar or Paladin, no Plate Barding Armor) and no Hand Cannoneer, Siege Onager or Bombard Cannon."],["Aztecs","Infantry and Monk",["Start with +50 gold","Villagers carry +3","Military Units train +15% faster","Monks gain +5 HP for each researched Monastery technology"],"Relics generate +33% gold",[["Jaguar Warrior","Infantry"]],["Atlatl","Skirmishers +1 attack, +1 range","Garland Wars","Infantry +4 attack"],"Stable, Keep, Bombard Tower, Hand Cannoneer, Cavalry Archer, Thumb Ring, Parthian Tactics, Halberdier, Heavy Scorpion, Bombard Cannon, Ring Archer Armor, Galleon (has regional Hulk instead), Heavy Demolition Ship, Cannon Galleon, Masonry, Architecture, Dry Dock, Hoardings, Two-Man Saw, Guilds","Aztecs have no Stable, so they fight with infantry and archers: Eagle Warriors for mobility and raiding, Jaguar Warriors against infantry, and Arbalesters/Skirmishers (Atlatl gives +1 attack/+1 range) for ranged support. Garland Wars (+4 infantry attack) makes their melee hit very hard late, and military units train 15% faster. Villagers carry +3 and they start with +50 gold, which suits early Militia/Eagle aggression. Monks gain HP for every Monastery tech, and Siege Rams plus Siege Onagers answer archers and buildings; no Halberdier, gunpowder or Galleon are the main gaps."],["Bengalis","Elephant and Naval",["Town Centers spawn 2 Villagers when the next Age is reached","Cavalry +2 attack vs. Skirmishers","Elephant Units receive -25% bonus damage and are more resistant to conversion","Monks +3 melee/+3 pierce armor","Ships regenerate 15 HP per minute"],"Trade Units generate +10% food in addition to gold",[["Ratha","Mounted Archer"]],["Paiks","Rathas and Elephant Units attack +20% faster","Mahayana","Villagers and Monks take -10% population space"],"Bombard Tower, Hand Cannoneer, Cavalry Archer, Thumb Ring, Parthian Tactics, Hussar, Knight, Battering Ram (has regional Armored Elephant instead), Siege Onager, Bombard Cannon, Plate Mail Armor, Heavy Demolition Ship, Treadmill Crane, Hoardings, Sappers, Heresy, Stone Shaft Mining","Bengalis are built around elephants: Elite Battle Elephants, Elite Elephant Archers and Armored/Siege Elephants take -25% bonus damage and resist conversion, and Paiks makes Rathas and Elephant units attack 20% faster. Back them with Arbalesters, Halberdiers and Heavy Scorpions, and use Monks, which get +3/+3 armor. Town Centers spawn 2 Villagers on every age-up, so building more Town Centers before advancing pays off, and Mahayana cuts Villager/Monk population space. They have no Knight line, no Hussar, no Hand Cannoneer and no Bombard Cannon, and their infantry lacks Plate Mail Armor."],["Berbers","Cavalry and Naval",["Villagers move +5% faster in Dark Age, +10% faster starting in Feudal Age","Stable Units cost -15/20% in Castle/Imperial Age","Ships move +10% faster"],"Genitour available at the Archery Range starting in Castle Age",[["Camel Archer","Mounted Archer"],["Genitour","Mounted Skirmisher"]],["Kasbah","Team Castles work +25% faster","Maghrebi Camels","Camel Units regenerate 15 HP per minute"],"Keep, Bombard Tower, Arbalester, Parthian Tactics, Halberdier, Gambesons, Paladin, Siege Ram, Siege Onager, Architecture, Sappers, Block Printing, Sanctity, Two-Man Saw","Berbers are a mobile cavalry civ: Stable units cost 15%/20% less in Castle/Imperial Age, so Knights/Cavaliers, Hussars and Heavy Camel Riders can be massed cheaply. Camel Archers (with Maghrebi Camels regeneration) are a strong answer to enemy cavalry archers, and Genitours are a mounted skirmisher option. Faster Villagers and faster ships help both their economy and their navy, which has the full tree. Foot archers stop at Crossbowman, and there is no Halberdier, Paladin, Siege Ram or Siege Onager, so they should use cavalry plus Bombard Cannons and Hand Cannoneers to finish games."],["Bohemians","Gunpowder and Monk",["Mining Camp technologies free","Blacksmiths and Universities cost -100 wood","Spearman-line deals +25% bonus damage","Fervor and Sanctity affect Villagers","Chemistry and Hand Cannoneer available in Castle Age"],"Markets work +80% faster",[["Hussite Wagon","Siege Gunpowder Unit"],["Houfnice","Siege Gunpowder Unit"]],["Wagenburg Tactics","Gunpowder Units move +10% faster","Hussite Reforms","Monks and Monastery technologies gold cost is replaced by food cost"],"Cavalry Archer (has regional Mounted Crossbowman instead), Heavy Mounted Crossbowman, Thumb Ring, Parthian Tactics, Gambesons, Hussar, Paladin, Bloodlines, Siege Ram, Siege Onager, Plate Barding Armor, Fast Fire Ship, Heavy Demolition Ship, Heated Shot, Dry Dock, Shipwright, Treadmill Crane, Hoardings, Crop Rotation","Bohemians get Chemistry and Hand Cannoneers in the Castle Age, so early gunpowder (with Halberdiers, who deal +25% bonus damage) is their signature. In the late game, Hussite Wagons, Houfnice and Bombard Cannons with Wagenburg Tactics (+10% gunpowder speed) make a slow but very strong push. Free Mining Camp techs and cheaper Blacksmiths/Universities help the economy, and Hussite Reforms turns Monk and Monastery tech gold costs into food. Their cavalry is very weak (no Bloodlines, Hussar, Paladin or Plate Barding Armor) and the navy lacks Fast Fire Ships and the late Dock techs."],["Britons","Foot Archer",["Shepherds work +25% faster","Town Centers cost -50% wood starting in Castle Age","Foot Archers +1/+2 range in Castle/Imperial Age"],"Archery Ranges work +10% faster",[["Longbowman","Foot Archer"]],["Yeomen","Foot Archers and Skirmisher-line +1 range; Watch Tower-line +2 attack","Warwolf","Trebuchets deal blast damage and are more accurate"],"Bombard Tower, Hand Cannoneer, Cavalry Archer (has regional Mounted Crossbowman instead), Thumb Ring, Parthian Tactics, Hussar, Paladin, Bloodlines, Siege Ram, Siege Onager, Bombard Cannon, Carrack, Elite Cannon Galleon, Redemption, Atonement, Heresy, Stone Shaft Mining, Crop Rotation","Britons are the classic foot-archer civ: Foot Archers get +1/+2 range in Castle/Imperial Age (more with Yeomen), so massed Arbalesters or Longbowmen can out-range archer counters. Pikemen/Halberdiers or Champions screen the archers, and Warwolf Trebuchets (blast damage, more accurate) handle sieging. Faster shepherds and cheaper Town Centers in Castle Age help a solid boom, and their team bonus makes Archery Ranges work 10% faster. Cavalry is weak (no Bloodlines, Hussar or Paladin) and there is no Hand Cannoneer, Siege Ram, Siege Onager or Bombard Cannon."],["Bulgarians","Infantry and Cavalry",["Militia-line upgrades free","Blacksmith and Siege Workshop technologies cost -50% food","Town Centers cost -50% stone","Can build Krepost in Castle Age"],"Blacksmiths work +80% faster",[["Konnik","Cavalry"]],["Stirrups","Cavalry attacks +33% faster","Bagains","Militia-line +5 melee armor"],"Bombard Tower, Fortified Wall, Crossbowman, Hand Cannoneer, Champion, Paladin, Bombard Cannon, Ring Archer Armor, Fast Fire Ship, Heavy Demolition Ship, Elite Cannon Galleon, Arrowslits, Dry Dock, Shipwright, Treadmill Crane, Hoardings, Faith, Atonement, Block Printing, Sanctity, Two-Man Saw","Bulgarians mix infantry and cavalry: Militia-line upgrades are free, so Man-at-Arms/Long Swordsman rushes and Bagains-armored Two-Handed Swordsmen work well, and Stirrups makes all cavalry attack 33% faster. Konniks, Hussars and Cavaliers plus Heavy Cavalry Archers give a mobile late game, and Blacksmith/Siege Workshop techs cost 50% less food. They can build Kreposts in Castle Age, and Town Centers cost 50% less stone. They have no Crossbowman/Arbalester, Champion, Paladin, Hand Cannoneer or Bombard Cannon, so Siege Rams and Siege Onagers handle buildings and archers."],["Burgundians","Cavalry",["Economic upgrades available one age earlier and cost -40% food","Stable technologies cost -50%","Cavalier upgrade available in Castle Age","Gunpowder Units +25% attack"],"Relics generate food in addition to gold",[["Coustillier","Cavalry"],["Flemish Militia","Infantry"]],["Burgundian Vineyards","Farmers slowly generate gold in addition to food","Flemish Revolution","All existing Villagers are transformed to Flemish Militia"],"Arbalester, Cavalry Archer (has regional Mounted Crossbowman instead), Heavy Mounted Crossbowman, Thumb Ring, Parthian Tactics, Gambesons, Bloodlines, Siege Ram, Siege Onager, Heavy Scorpion, Ring Archer Armor, Heavy Demolition Ship, Siege Engineers, Heated Shot, Dry Dock, Shipwright, Theocracy, Heresy","Burgundians research economic upgrades one age earlier for 40% less food and get the Cavalier upgrade in Castle Age, so a strong Knight-into-Cavalier push is the main plan. Stable techs cost 50% less, which helps Hussars, Paladins and Coustilliers. Gunpowder units get +25% attack, so Hand Cannoneers and Bombard Cannons are good late, and Flemish Revolution turns all Villagers into Flemish Militia as a last-ditch power spike. Gaps: no Bloodlines, no Arbalester, no Siege Ram, Siege Onager or Heavy Scorpion."],["Burmese","Infantry and Cavalry",["Lumber Camp technologies free","Infantry +1/+2/+3 attack in Feudal/Castle/Imperial Age","Battle Elephants +1 melee/+1 pierce armor","Monastery technologies cost -50%"],"Relics visible on the map at the start of the game",[["Arambai","Ranged Mounted Unit"]],["Manipur Cavalry","Cavalry +4 attack vs. Ranged Soldiers","Howdah","Battle Elephants +1 melee/+1 pierce armor"],"Bombard Tower, Arbalester, Hand Cannoneer, Thumb Ring, Paladin, Siege Ram, Siege Onager, Leather Archer Armor, Ring Archer Armor, Fast Fire Ship, Heavy Demolition Ship, Arrowslits, Shipwright, Hoardings, Sappers, Heresy, Stone Shaft Mining","Burmese get +1/+2/+3 infantry attack from Feudal Age onward and free Lumber Camp techs, so early infantry pressure into a cavalry and elephant game works well. Battle Elephants get +1/+1 armor (and another +1/+1 with Howdah), and Manipur Cavalry gives cavalry +4 attack vs archers, which suits Hussars, Cavaliers and Elite Battle Elephants against ranged armies. Arambai add a ranged mounted unique unit, and Monastery techs cost 50% less. Their foot archers are very poor (no Arbalester, no Leather or Ring Archer Armor) and they lack Paladin, Siege Ram, Siege Onager and Hand Cannoneer."],["Byzantines","Defensive",["Buildings +10/20/30/40% HP in Dark/Feudal/Castle/Imperial Age","Camel Riders, Skirmishers and Spearman-line cost -25%","Town Watch, Town Patrol free","Advancing to Imperial Age costs -33%","Fire Ships and Dromons attack +25% faster"],"Monks heal +100% faster",[["Cataphract","Cavalry"]],["Greek Fire","Fire Ships +1 range; Dromons and Bombard Towers increased blast radius","Logistica","Cataphracts and Varangian Guards deal trample damage"],"Parthian Tactics, Bloodlines, Siege Onager, Heavy Scorpion, Blast Furnace, Cannon Galleon, Masonry, Architecture, Siege Engineers, Heated Shot, Sappers, Herbal Medicine","Byzantines are a defensive, flexible civ: buildings get extra HP each age, and Skirmishers, Spearmen and Camel Riders cost 25% less, so cheap trash units hold well. Cataphracts (trample with Logistica) are their strongest unit against infantry, with Arbalesters, Hand Cannoneers, Paladins and Heavy Camels also available. Imperial Age costs 33% less, and Fire Ships/Dromons attack 25% faster, which makes them strong on water. They have no Bloodlines, Bl
